<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Conversor de unidades</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        color: #172033;
        background: #f3f5f9;
      }

      body {
        box-sizing: border-box;
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 2rem 1rem;
        place-items: center;
      }

      main {
        width: min(100%, 28rem);
        padding: 2rem;
        border-radius: 1rem;
        background: white;
        box-shadow: 0 1rem 2.5rem rgb(23 32 51 / 10%);
      }

      h1 {
        margin-top: 0;
      }

      form {
        display: grid;
        gap: 1rem;
      }

      label {
        display: grid;
        gap: 0.4rem;
        font-weight: 600;
      }

      input,
      select,
      button {
        box-sizing: border-box;
        width: 100%;
        min-height: 2.8rem;
        padding: 0.6rem 0.75rem;
        border: 1px solid #cbd2df;
        border-radius: 0.5rem;
        font: inherit;
      }

      button {
        border: 0;
        color: white;
        background: #3157c8;
        cursor: pointer;
        font-weight: 700;
      }

      button:hover {
        background: #2445a8;
      }

      #resultado {
        min-height: 1.5rem;
        margin-bottom: 0;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Conversor de unidades</h1>
      <form id="formulario">
        <label for="tipo">Tipo de medida</label>
        <select id="tipo" name="tipo">
          {% for tipo, unidades in tipos.items() %}
          <option value="{{ tipo }}">{{ tipo|capitalize }}</option>
          {% endfor %}
        </select>

        <label for="valor">Valor</label>
        <input id="valor" name="valor" type="number" step="any" required>

        <label for="de">De</label>
        <select id="de" name="de"></select>

        <label for="a">A</label>
        <select id="a" name="a"></select>

        <button type="submit">Convertir</button>
      </form>
      <p id="resultado" aria-live="polite"></p>
    </main>
    <script>
      const unidadesPorTipo = {{ tipos | tojson }};
      const formulario = document.querySelector("#formulario");
      const tipo = document.querySelector("#tipo");
      const unidadOrigen = document.querySelector("#de");
      const unidadDestino = document.querySelector("#a");
      const salida = document.querySelector("#resultado");

      function actualizarUnidades() {
        const unidades = unidadesPorTipo[tipo.value];
        for (const selector of [unidadOrigen, unidadDestino]) {
          selector.replaceChildren(
            ...unidades.map((unidad) => new Option(unidad, unidad)),
          );
        }
      }

      tipo.addEventListener("change", actualizarUnidades);
      actualizarUnidades();

      formulario.addEventListener("submit", async (evento) => {
        evento.preventDefault();
        salida.textContent = "";
        const parametros = new URLSearchParams(new FormData(formulario));
        try {
          const respuesta = await fetch(`/api/convertir?${parametros}`);
          const datos = await respuesta.json();
          if (!respuesta.ok) {
            salida.textContent = datos.detail;
            return;
          }
          salida.textContent = `Resultado: ${datos.resultado}`;
        } catch {
          salida.textContent = "No se pudo completar la conversión.";
        }
      });
    </script>
  </body>
</html>
